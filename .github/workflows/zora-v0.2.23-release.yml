name: Zora v0.2.23 cross-device bookmark sync release

on:
  push:
    branches:
      - release/v0.2.23
    paths:
      - ".github/workflows/zora-v0.2.23-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zora-v0.2.23-release
  cancel-in-progress: false

jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.23
          fetch-depth: 0
          persist-credentials: true

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.2.23"
          test "$(node -p "require('./package.json').version")" = "0.2.23"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.23"

          cat > /tmp/expected-files <<'EOF'
          .github/workflows/zora-v0.2.23-release.yml
          manifest.json
          package-lock.json
          package.json
          src/components/epub/EpubReaderApp.svelte
          src/services/epub/EpubBookmarkService.ts
          src/services/sync/ZoraSyncService.ts
          src/services/sync/ZoraSyncTypes.ts
          src/services/sync/__tests__/ZoraSyncService.test.ts
          versions.json
          EOF
          git diff --name-only v0.2.22...HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          if git ls-remote --exit-code --tags origin refs/tags/v0.2.23 >/dev/null 2>&1; then
            echo "::error::Tag v0.2.23 already exists."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted bookmark sync tests
        run: |
          npx vitest run             src/services/sync/__tests__/ZoraSyncService.test.ts             src/services/epub/__tests__/EpubBookmarkService.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release assets
        run: npm run verify:release

      - name: Tag tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zora Release Action"
          git config user.email "zora-release@users.noreply.github.com"
          git tag -a v0.2.23 -m "Zora Reader v0.2.23"
          git push origin refs/tags/v0.2.23
