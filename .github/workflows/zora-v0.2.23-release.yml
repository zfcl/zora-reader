name: Publish Zora v0.2.23 cross-device bookmark sync

on:
  push:
    branches:
      - release/v0.2.23
    paths:
      - ".github/workflows/zora-v0.2.23-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-zora-v0.2.23
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested release tag
        uses: actions/checkout@v4
        with:
          ref: v0.2.23
          fetch-depth: 0

      - name: Verify tested release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "551dc670e3b30333048bcffae9a862dfc30a6946"
          test "$(node -p "require('./manifest.json').version")" = "0.2.23"
          test "$(node -p "require('./package.json').version")" = "0.2.23"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.23"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted bookmark sync tests
        run: npx vitest run src/services/sync/__tests__/ZoraSyncService.test.ts src/services/epub/__tests__/EpubBookmarkService.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release assets
        run: npm run verify:release

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          cp dist/main.js dist/manifest.json dist/styles.css ./
          zip -q zora-reader-v0.2.23.zip main.js manifest.json styles.css LICENSE NOTICE.md

      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.23 > /dev/null 2>&1; then
            gh release upload v0.2.23 main.js manifest.json styles.css zora-reader-v0.2.23.zip --clobber
            gh release edit v0.2.23 --title "Zora Reader v0.2.23"
          else
            gh release create v0.2.23               main.js               manifest.json               styles.css               zora-reader-v0.2.23.zip               --target "551dc670e3b30333048bcffae9a862dfc30a6946"               --title "Zora Reader v0.2.23"               --notes "Fixes desktop/mobile bookmark synchronization with per-bookmark Vault records, stable EPUB identities, deletion tombstones, legacy bookmark migration, concurrent merge protection, and automatic reader refresh when synced bookmark files change."
          fi

          mapfile -t ASSETS < <(gh release view v0.2.23 --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets
          printf '%s\n' main.js manifest.json styles.css zora-reader-v0.2.23.zip | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
          gh release view v0.2.23 --json url --jq .url
