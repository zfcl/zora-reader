name: Zora v0.2.13 iOS popover release

on:
  push:
    branches:
      - personal
    paths:
      - ".github/workflows/zora-v0.2.13-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zora-v0.2.13-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact personal head
        uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: true

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="0c95a3023fba2bf9e7db8e6ae7f5d12a83f29aae"
          CURRENT="$(git rev-parse HEAD)"
          PARENT="$(git rev-parse HEAD^)"
          SUBJECT="$(git log -1 --pretty=%s)"

          test "$PARENT" = "$EXPECTED_PARENT"
          test "$SUBJECT" = "fix(mobile): harden iOS popover drag lifecycle"
          test "$(node -p "require('./manifest.json').version")" = "0.2.13"
          test "$(node -p "require('./package.json').version")" = "0.2.13"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.13"

          cat > /tmp/expected-files <<'EOF'
          .github/workflows/zora-v0.2.13-release.yml
          manifest.json
          package-lock.json
          package.json
          src/components/epub/SelectionComprehensionPopover.svelte
          src/components/epub/SelectionDictionaryPopover.svelte
          src/components/epub/SelectionGrammarPopover.svelte
          src/components/epub/SelectionNotePopover.svelte
          src/components/epub/SelectionToolbar.svelte
          src/components/epub/__tests__/mobile-selection-ux.test.ts
          src/components/epub/__tests__/zora-draggable.test.ts
          src/components/epub/__tests__/zora-popover-lifecycle.test.ts
          src/components/epub/zora-draggable.ts
          src/components/epub/zora-popover-lifecycle.ts
          src/styles/epub/zora-lookup.css
          versions.json
          EOF
          git diff --name-only HEAD^ HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          if git ls-remote --exit-code --tags origin refs/tags/v0.2.13 >/dev/null 2>&1; then
            echo "::error::Tag v0.2.13 already exists."
            exit 1
          fi

          echo "Verified release commit $CURRENT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted mobile lifecycle tests
        run: |
          npx vitest run \
            src/components/epub/__tests__/zora-draggable.test.ts \
            src/components/epub/__tests__/zora-popover-lifecycle.test.ts \
            src/components/epub/__tests__/mobile-selection-ux.test.ts \
            src/components/epub/__tests__/mobile-direct-selection.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release assets
        run: npm run verify:release

      - name: Tag tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zora Release Action"
          git config user.email "zora-release@users.noreply.github.com"
          git tag -a v0.2.13 -m "Zora Reader v0.2.13"
          git push origin refs/tags/v0.2.13

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          cp dist/main.js dist/manifest.json dist/styles.css ./
          zip -q zora-reader-v0.2.13.zip \
            main.js manifest.json styles.css LICENSE NOTICE.md

      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          gh release create v0.2.13 \
            main.js \
            manifest.json \
            styles.css \
            zora-reader-v0.2.13.zip \
            --target "$HEAD_SHA" \
            --title "Zora Reader v0.2.13" \
            --notes "Fixes iPhone popover drag sessions locking after release, makes close controls cancel stale drags, removes mobile portal teardown flashing, and restores real safe-viewport drag space."

          mapfile -t ASSETS < <(gh release view v0.2.13 --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets
          printf '%s\n' main.js manifest.json styles.css zora-reader-v0.2.13.zip | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
          gh release view v0.2.13 --json url --jq .url
