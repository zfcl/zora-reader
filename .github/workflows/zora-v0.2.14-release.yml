name: Zora v0.2.14 reader UI release

on:
  push:
    branches:
      - personal
    paths:
      - ".github/workflows/zora-v0.2.14-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zora-v0.2.14-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact personal head
        uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: true

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="5221d0c158f029762252b757831ab46425eac6ee"
          CURRENT="$(git rev-parse HEAD)"
          PARENT="$(git rev-parse HEAD^)"
          SUBJECT="$(git log -1 --pretty=%s)"

          test "$PARENT" = "$EXPECTED_PARENT"
          test "$SUBJECT" = "fix(epub): refresh note markers and polish reader UI"
          test "$(node -p "require('./manifest.json').version")" = "0.2.14"
          test "$(node -p "require('./package.json').version")" = "0.2.14"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.14"

          cat > /tmp/expected-files <<'EOF'
          .github/workflows/zora-v0.2.14-release.yml
          manifest.json
          package-lock.json
          package.json
          src/components/epub/EpubReaderApp.svelte
          src/components/epub/EpubWelcome.svelte
          src/components/epub/SelectionComprehensionPopover.svelte
          src/components/epub/SelectionNotePopover.svelte
          src/components/epub/SelectionToolbar.svelte
          src/components/epub/__tests__/zora-popover-lifecycle.test.ts
          src/components/epub/__tests__/zora-targeted-regressions.test.ts
          src/components/epub/epub-tutorial-content.ts
          src/components/epub/tutorial-locales/en-US.json
          src/components/epub/tutorial-locales/ru-RU.json
          src/components/epub/tutorial-locales/zh-CN.json
          src/components/epub/tutorial-locales/zh-TW.json
          src/components/epub/zora-popover-lifecycle.ts
          src/components/settings/EpubSettingsAboutTab.svelte
          src/components/settings/components/EnhancedActivationForm.svelte
          src/services/ai/zora/__tests__/zora-comprehension-service.test.ts
          src/services/ai/zora/__tests__/zora-study-note-service.test.ts
          src/services/ai/zora/zora-comprehension-service.ts
          src/services/ai/zora/zora-study-note-service.ts
          src/services/epub/__tests__/zora-comprehension-service.test.ts
          src/services/epub/__tests__/zora-study-note-service.test.ts
          src/services/epub/epub-bookmark-page-render.ts
          src/utils/i18n/flat-locales/en-US.template.json
          src/utils/i18n/overlays/ja-JP.json
          src/utils/i18n/overlays/ko-KR.json
          src/utils/i18n/overlays/ru-RU.json
          src/utils/i18n/resources/app-shell-epub.ts
          src/utils/i18n/resources/epub.ts
          versions.json
          EOF
          git diff --name-only HEAD^ HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          if git ls-remote --exit-code --tags origin refs/tags/v0.2.14 >/dev/null 2>&1; then
            echo "::error::Tag v0.2.14 already exists."
            exit 1
          fi

          echo "Verified release commit $CURRENT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted lifecycle and marker tests
        run: |
          npx vitest run \
            src/components/epub/__tests__/zora-popover-lifecycle.test.ts \
            src/components/epub/__tests__/zora-targeted-regressions.test.ts \
            src/services/epub/__tests__/zora-comprehension-service.test.ts \
            src/services/epub/__tests__/zora-study-note-service.test.ts \
            src/services/epub/__tests__/reader-annotation-overlayer.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release assets
        run: npm run verify:release

      - name: Tag tested commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Zora Release Action"
          git config user.email "zora-release@users.noreply.github.com"
          git tag -a v0.2.14 -m "Zora Reader v0.2.14"
          git push origin refs/tags/v0.2.14

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          cp dist/main.js dist/manifest.json dist/styles.css ./
          zip -q zora-reader-v0.2.14.zip \
            main.js manifest.json styles.css LICENSE NOTICE.md

      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          gh release create v0.2.14 \
            main.js \
            manifest.json \
            styles.css \
            zora-reader-v0.2.14.zip \
            --target "$HEAD_SHA" \
            --title "Zora Reader v0.2.14" \
            --notes "Fixes iPhone selection-dismiss popover flashing, refreshes reading-note markers immediately through the persisted Markdown pipeline, streamlines comprehension output, and adds a compact first-open Zora Reader welcome."

          mapfile -t ASSETS < <(gh release view v0.2.14 --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets
          printf '%s\n' main.js manifest.json styles.css zora-reader-v0.2.14.zip | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
          gh release view v0.2.14 --json url --jq .url
