name: Release Zora v0.2.22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0.2.22-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zora-v0.2.22-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v0.2.21 release source
        uses: actions/checkout@v4
        with:
          ref: release/v0.2.21
          fetch-depth: 0

      - name: Verify base and apply v0.2.22 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e5efe8ea9762579816ce2d3cc7d4342e1398cba7"
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.22 >/dev/null 2>&1; then
            echo "::error::Tag v0.2.22 already exists."
            exit 1
          fi
          git fetch origin main
          git show origin/main:scripts/v0.2.22-patch.py > /tmp/v0.2.22-patch.py
          python3 /tmp/v0.2.22-patch.py
          test "$(node -p "require('./manifest.json').version")" = "0.2.22"
          test "$(node -p "require('./package.json').version")" = "0.2.22"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.22"
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          manifest.json
          package-lock.json
          package.json
          src/components/epub/__tests__/mobile-direct-selection.test.ts
          src/components/epub/__tests__/sentence-selection.test.ts
          src/components/epub/mobile-direct-selection.ts
          src/components/epub/sentence-selection.ts
          versions.json
          EOF
          git diff --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify release assets
        run: npm run verify:release

      - name: Commit and push release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json package-lock.json versions.json src/components/epub/mobile-direct-selection.ts src/components/epub/sentence-selection.ts src/components/epub/__tests__/mobile-direct-selection.test.ts src/components/epub/__tests__/sentence-selection.test.ts
          git commit -m 'fix: constrain mobile drag selection for v0.2.22'
          git push origin HEAD:release/v0.2.22

      - name: Tag release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.2.22 -m 'Zora Reader v0.2.22'
          git push origin v0.2.22

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          cp dist/main.js dist/manifest.json dist/styles.css ./
          zip zora-reader-v0.2.22.zip main.js manifest.json styles.css LICENSE NOTICE.md

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.22 main.js manifest.json styles.css zora-reader-v0.2.22.zip --title 'Zora Reader v0.2.22' --notes $'v0.2.22\n\n- 修复移动端拖选跨页时吞掉下一整页的问题：现在以初始触点所在小句为唯一目标，遇到第一个分隔标点即停止。\n- 小句边界支持英文与中文的逗号、句号、分号、问号和感叹号（, . ; ? ! / ，。；？！），跨视觉页也只延伸到当前小句的结尾。\n- 即使拖动终点越过后续小句，也不会把后续内容带入选区；无标点异常内容加入 240 字符单边硬上限。\n- 保持手势区分：移动不足 5px 的单点只选一个词，超过阈值的拖动自动吸附整小句，降低手机精确划词要求。\n- 新增截图原文跨页逗号、终点越界、中英文标点、缩写与小数、无标点上限回归测试；全量 139 个测试文件、1039 项测试通过。'
          mapfile -t ASSETS < <(gh release view v0.2.22 --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets
          printf '%s\n' main.js manifest.json styles.css zora-reader-v0.2.22.zip | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
          gh release view v0.2.22 --json url --jq .url
