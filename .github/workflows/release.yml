name: Release plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Test plugin
        run: npm test

      - name: Prepare release files
        run: |
          cp dist/main.js dist/manifest.json dist/styles.css ./
          zip zora-reader-${GITHUB_REF_NAME}.zip main.js manifest.json styles.css LICENSE NOTICE.md

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            zora-reader-${GITHUB_REF_NAME}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Updating existing release ${GITHUB_REF_NAME}..."
            gh release upload "${GITHUB_REF_NAME}" \
              main.js \
              manifest.json \
              styles.css \
              zora-reader-${GITHUB_REF_NAME}.zip \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "Zora Reader ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              main.js \
              manifest.json \
              styles.css \
              zora-reader-${GITHUB_REF_NAME}.zip \
              --title "Zora Reader ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
